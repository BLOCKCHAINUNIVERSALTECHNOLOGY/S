<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>S Play — Browser Playground</title>
<style>
  :root { --bg:#0a0e17; --panel:#111827; --accent:#22d3ee; --text:#e2e8f0; --muted:#64748b; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: ui-monospace, monospace; background: var(--bg); color: var(--text); height: 100vh; display: flex; flex-direction: column; }
  header { padding: 12px 20px; border-bottom: 1px solid #1e293b; display: flex; align-items: center; gap: 16px; }
  header h1 { font-size: 18px; color: var(--accent); }
  header span { color: var(--muted); font-size: 12px; }
  .toolbar { margin-left: auto; display: flex; gap: 8px; }
  button { background: var(--accent); color: #0a0e17; border: none; padding: 8px 16px; border-radius: 6px; font-weight: 700; cursor: pointer; font-family: inherit; }
  button.secondary { background: #1e293b; color: var(--text); }
  main { flex: 1; display: grid; grid-template-columns: 1fr 1fr; gap: 1px; background: #1e293b; min-height: 0; }
  .panel { background: var(--panel); display: flex; flex-direction: column; min-height: 0; }
  .panel h2 { font-size: 11px; text-transform: uppercase; letter-spacing: 0.1em; color: var(--muted); padding: 8px 12px; border-bottom: 1px solid #1e293b; }
  textarea, pre { flex: 1; background: transparent; border: none; color: var(--text); padding: 12px; font: inherit; resize: none; outline: none; overflow: auto; }
  pre { white-space: pre-wrap; }
  .examples { padding: 8px 12px; display: flex; gap: 6px; flex-wrap: wrap; border-bottom: 1px solid #1e293b; }
  .examples button { padding: 4px 10px; font-size: 11px; background: #1e293b; color: var(--accent); }
  footer { padding: 8px 20px; font-size: 11px; color: var(--muted); border-top: 1px solid #1e293b; }
</style>
</head>
<body>
<header>
  <h1>S Play</h1>
  <span>Browser Playground · v1.2 · subset interpreter</span>
  <div class="toolbar">
    <button class="secondary" onclick="loadEx('hello')">Hello</button>
    <button class="secondary" onclick="loadEx('fact')">Factorial</button>
    <button class="secondary" onclick="loadEx('loop')">Loop</button>
    <button onclick="run()">Run ▶</button>
  </div>
</header>
<main>
  <div class="panel">
    <h2>Code</h2>
    <textarea id="code" spellcheck="false">// S Play — try me
let name = "Queen"
print "Hello,", name
print 2 + 3 * 4

var i = 1
loop {
  print "count:", i
  if i >= 3 { break }
  i = i + 1
}
</textarea>
  </div>
  <div class="panel">
    <h2>Output</h2>
    <pre id="out">Ready. Press Run.</pre>
  </div>
</main>
<footer>S = Simple · Safe · Supreme · Client-side subset (let/var/print/if/loop/arith). Full language via <code>python3 s run</code>.</footer>
<script src="s_mini.js"></script>
<script>
const EXAMPLES = {
  hello: `print "Hello, Supreme World!"\nprint "S = Simple + Safe + Supreme"`,
  fact: `fn fact(n) {\n  if n <= 1 { ret 1 }\n  ret n * fact(n - 1)\n}\nprint fact(5)`,
  loop: `var i = 0\nloop {\n  i = i + 1\n  print i\n  if i >= 5 { break }\n}`
};
function loadEx(k) { document.getElementById('code').value = EXAMPLES[k]; }
function run() {
  const src = document.getElementById('code').value;
  const out = document.getElementById('out');
  try {
    out.textContent = SMini.run(src);
  } catch (e) {
    out.textContent = 'error: ' + e.message;
  }
}
</script>
</body>
</html>
